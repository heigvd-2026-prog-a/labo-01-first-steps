name: grading

# Two-tier grading — thin shim over the reusable pipeline in heig-tin-info/score.
#   - every push          -> objective mark (build + tests), indicative GRADE
#   - repository_dispatch -> full LLM review fired by heig-classroom at the
#                            deadline / a milestone (authoritative GRADE ;
#                            criteria.yml annotated by the grader bot)
# Do NOT edit this file: it is protected and any change is reverted by the
# platform (a tampered pipeline voids the grade).
on:
  push:
    branches: [main, master]
  workflow_dispatch:   # teacher's "grade now" button in heig-classroom
  repository_dispatch:
    types: [grade-final, grade-milestone]

permissions:
  contents: write   # the llm-review job commits the review file
  checks: write

jobs:
  grading:
    uses: heig-tin-info/score/.github/workflows/grading.yml@0.7.5
    # Org secrets do NOT cross the organisation boundary with `secrets:
    # inherit` (the reusable workflow lives in heig-tin-info): the key must
    # be passed explicitly — the caller evaluates it in its own context.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      criteria-file: criteria.yml
      build-command: make
      test-command: pip install pytest && pytest --junitxml=report.xml
      review-test-command: pip install pytest && pytest -vv
      tests-criterion: binary.all-tests-passed
      build-errors-criterion: build.with-no-errors
      score-spec: "StudentScore[llm]==0.7.5"
      scale: "6"
      apt-packages: "build-essential"
