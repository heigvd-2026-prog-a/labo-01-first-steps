name: grading

# Immediate test feedback — thin shim over the reusable pipeline in
# heig-tin-info/score.
#   - every push -> objective mark (build + tests), indicative GRADE
# The final grade does not come from here: the Quiz platform computes it from
# the criteria of criteria.yml. The pipeline's LLM review tier
# (repository_dispatch) is therefore no longer triggered.
# Do NOT edit this file: it is protected and any change is reverted by the
# platform (a tampered pipeline voids the grade).
on:
  push:
    branches: [main, master]
  workflow_dispatch:   # teacher's "grade now" button

permissions:
  contents: read
  checks: write

jobs:
  grading:
    uses: heig-tin-info/score/.github/workflows/grading.yml@0.7.5
    with:
      criteria-file: criteria.yml
      build-command: make
      test-command: pip install pytest && pytest --junitxml=report.xml
      tests-criterion: binary.all-tests-passed
      build-errors-criterion: build.with-no-warnings
      scale: "6"
      apt-packages: "build-essential"
